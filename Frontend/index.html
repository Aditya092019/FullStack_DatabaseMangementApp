<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="record.css">
    <title>Create Table</title>

        
</head>

<body>
<div class="row">    
<div class="column">
    <div class="tableName-bold"></div>
    <button class="button" id="create-btn-table" onclick="createModal()">
       + Create New Table
    </button>
</div>
<div class="recordsContainer">
    <table id="recordsTable">
        <thead id="recordsHead">
        </thead>
        <tbody id="recordsBody">
        </tbody>
    </table>
</div>
</div>
<div class="container">
    <div class="modal">
        <div class="modal-header">
            <h2>Create Table</h2>
            <span class="close" onclick="closeModal()">×</span>
        </div>
        <label>Table name</label>
        <input
            type="text"
            id="tableName"
            class="table-name"
            placeholder="users"
        >
        <div class="field-heading">
            <label>Field names</label>
            <label>Type</label>
        </div>
        <div id="fieldsContainer">
            <div class="field-row">
                <input
                    type="text"
                    class="field-name"
                    placeholder="Field Name"
                >
                <select class="field-type">
                    <option value="STRING">STRING</option>
                    <option value="INTEGER">INTEGER</option>
                    <option value="BOOLEAN">BOOLEAN</option>
                    <option value="DATE">DATE</option>
                    <option value="FLOAT">FLOAT</option>
                </select>
            </div>
        </div>
        <span
            class="add-field"
            onclick="addField()"
        >
            Add another field
        </span>
        <br>
        <button
            class="create-btn"
            onclick="createTable()"
        >
            Create Table
        </button>
    </div> 
</div>


<div class="insertContainer">
    <div class="insertModal">
         <div class="insertModal-header">
            <h3>Add record</h3>
            <span class="insertClose" onclick="closeInsertModal()">×</span>
         </div>
         <div id="insertFieldsContainer"></div>
        <button
            class="insertModal-bottom"
            type="button"
            onclick="insertRecord()"
        >
            Add record
        </button>
    </div>
</div>

<script src="index.js"></script>
<script src="table.js"></script>

</body>
</html>
